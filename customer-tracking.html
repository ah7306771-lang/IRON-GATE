<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>متابعة الشحنة | Iron Gate</title>
<style>
:root{--gold:#c99a24;--ink:#182437;--muted:#6b7280;--line:#e7eaf0;--bg:#f4f6f9;--green:#16865b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:1080px;margin:auto;padding:22px 14px 42px}
.tracking-brands{display:flex;align-items:center;gap:18px;margin:4px 0 18px;padding:13px 16px;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 5px 18px #18243708;min-width:0}
.developer-brand,.customer-brand{display:flex;align-items:center;gap:11px;min-width:0}
.developer-brand{direction:ltr;text-align:left;flex:1 1 52%}
.developer-logo{width:58px;height:58px;flex:0 0 58px;object-fit:contain;border-radius:50%;background:#101a31}
.customer-brand{direction:rtl;text-align:right;flex:1 1 48%;border-inline-start:1px solid var(--line);padding-inline-start:18px}
.customer-mark{width:48px;height:48px;flex:0 0 48px;border-radius:12px;background:#f5f7fa;display:grid;place-items:center;overflow:hidden;border:1px solid #edf0f4;color:#a07818;font-size:20px;font-weight:900}
.customer-mark img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.brand-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand-copy small{display:block;color:var(--muted);font-size:11px;font-weight:700}
.brand-copy b{font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.brand-copy span{color:var(--muted);font-size:10px;line-height:1.5}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 8px 28px #1824370a}.hero{background:linear-gradient(135deg,#182437,#263c5c);color:#fff;border:0}.hero h1{font-size:22px;margin:0 0 8px}.hero p{margin:0;color:#d9e0ea;line-height:1.8}.state{display:inline-flex;align-items:center;gap:7px;background:#ffffff1b;border:1px solid #ffffff2b;border-radius:99px;padding:7px 12px;margin-top:15px;font-size:13px}
h2{font-size:17px;margin:0 0 16px}.steps{display:grid;gap:0}.step{display:grid;grid-template-columns:38px 1fr;gap:12px;position:relative;padding-bottom:18px}.step:not(:last-child):before{content:"";position:absolute;right:18px;top:38px;bottom:0;width:2px;background:var(--line)}.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#f1f3f6;color:#667085;z-index:1}.step.done .dot,.step.current .dot{background:#fff3cf;color:#8b6500;border:1px solid #f0d88c}.step.done:not(.current) .dot{background:#e7f6ef;color:var(--green);border-color:#c5ead8}.step b{font-size:14px;display:block;padding-top:3px}.step small{display:block;color:var(--muted);font-size:12px;margin-top:6px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{background:#f8f9fb;border:1px solid #edf0f4;border-radius:12px;padding:12px;min-width:0}.field small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.field b{font-size:14px;overflow-wrap:anywhere}.field a{display:inline-flex;margin-top:7px;color:#8b6500;font-weight:800;font-size:12px;text-decoration:none}
.muted{color:var(--muted);font-size:13px;line-height:1.8}.error{text-align:center;padding:35px 18px}.spinner{width:28px;height:28px;border:3px solid #e8eaf0;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}footer{text-align:center;color:#9299a5;font-size:11px;padding:16px}
.tracking-layout{display:grid;grid-template-columns:minmax(310px,.9fr) minmax(0,1.1fr);gap:12px;align-items:start;direction:rtl}
.tracking-side{display:grid;gap:12px;min-width:0}.tracking-main{min-width:0}.tracking-layout>.card,.tracking-side>.card{margin:0}
.documents-list{display:grid;gap:9px}.document-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid #edf0f4;background:#f8f9fb;border-radius:11px;min-width:0}.document-item .doc-name{font-size:13px;overflow-wrap:anywhere;min-width:0;flex:1}.document-item a{flex:0 0 auto;color:#8b6500;font-size:12px;font-weight:700;text-decoration:none;border:1px solid #e7d7ac;border-radius:8px;padding:8px 10px;background:#fff}.document-item a:hover{text-decoration:underline}.document-meta{display:block;font-size:10px;color:var(--muted);margin-top:4px}
@media(max-width:760px){.tracking-layout{grid-template-columns:1fr}.tracking-side{order:0}.tracking-main{order:1}}
@media(max-width:560px){.wrap{padding:14px 10px 30px}.tracking-brands{gap:10px;padding:10px 11px;margin-bottom:12px}.developer-brand,.customer-brand{gap:7px}.developer-logo{width:42px;height:42px;flex-basis:42px}.customer-brand{padding-inline-start:10px}.customer-mark{width:38px;height:38px;flex-basis:38px;border-radius:10px}.brand-copy small{font-size:9px}.brand-copy b{font-size:12px}.brand-copy span{font-size:8px}.card{padding:16px;border-radius:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:20px}.document-item{align-items:flex-start;flex-wrap:wrap}.document-item a{margin-inline-start:auto}}
@media(max-width:380px){.tracking-brands{gap:7px;padding:9px 8px}.developer-logo{width:36px;height:36px;flex-basis:36px}.customer-mark{width:32px;height:32px;flex-basis:32px}.brand-copy b{font-size:11px}.brand-copy span{display:none}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<header class="tracking-brands" aria-label="هوية مطور النظام والشركة العميل">
  <section class="developer-brand">
    <img class="developer-logo" src="developer-logo.webp" alt="شعار H2M+ ERP Systems">
    <div class="brand-copy"><small>مطور النظام</small><b>H2M+ ERP Systems</b><span>Premium Business Solutions</span></div>
  </section>
  <section class="customer-brand">
    <div class="customer-mark" id="customerCompanyMark" aria-hidden="true">IG</div>
    <div class="brand-copy"><small>الشركة صاحبة الشحنة</small><b id="customerCompanyName">جاري تحميل اسم الشركة...</b><span id="customerCompanySubtitle" hidden></span></div>
  </section>
</header>
<div id="app"><section class="card error"><div class="spinner"></div><b>جاري تحميل بيانات الشحنة...</b></section></div>
<footer>H2M+ ERP Systems · صفحة متابعة الشحنة للعرض فقط</footer></main>
<script>
const API="https://wadovjghevemdmqkhhml.supabase.co/functions/v1/shipment-track";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>{if(!v)return "—";const d=new Date(v);return Number.isNaN(d.getTime())?"—":d.toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"})};
function field(label,value){return `<div class="field"><small>${esc(label)}</small><b>${esc(value||"—")}</b></div>`}
function phoneField(phone){const p=String(phone||"").trim();const tel=p.replace(/[^0-9+*#]/g,"");return `<div class="field"><small>هاتف السائق</small><b dir="ltr" style="display:block;text-align:right">${esc(p||"—")}</b>${tel?`<a href="tel:${esc(tel)}">اتصال بالسائق</a>`:""}</div>`}
function safeLogoUrl(v){const s=String(v||"").trim();if(/^https:\/\//i.test(s)&&!/["'<>]/.test(s))return s;if(/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=\r\n]+$/i.test(s))return s;return ""}
function renderCompany(t){const n=String(t.companyName||"").trim();const nameEl=document.getElementById("customerCompanyName");if(nameEl)nameEl.textContent=n||"اسم الشركة غير محدد في إعدادات النظام";const mark=document.getElementById("customerCompanyMark");const logo=safeLogoUrl(t.companyLogo);if(mark&&logo)mark.innerHTML=`<img src="${esc(logo)}" alt="شعار الشركة" onerror="this.remove();this.parentNode.textContent='IG'">`;}
function renderDocuments(docs){
  const items=Array.isArray(docs)?docs:[];
  if(!items.length)return `<p class="muted">لا توجد مستندات معتمدة للعرض في رابط المتابعة حاليًا.</p>`;
  return `<div class="documents-list">${items.map((doc,i)=>{
    const name=esc(doc.fileName||doc.name||doc.title||`مستند الشحنة ${i+1}`);
    const url=String(doc.url||doc.downloadUrl||"");
    const safeUrl=/^https:\/\//i.test(url)&&!/["'<>]/.test(url)?esc(url):"";
    return `<div class="document-item"><div class="doc-name">📄 ${name}<span class="document-meta">${esc(doc.category||"مرفق")} · ${fmt(doc.createdAt||doc.at)}</span></div>${safeUrl?`<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">عرض المستند</a>`:`<span class="muted">غير متاح</span>`}</div>`;
  }).join("")}</div>`;
}
async function load(){const token=new URLSearchParams(location.search).get("token")||"";if(!/^[a-f0-9]{64}$/i.test(token))throw Error("رابط المتابعة غير صحيح أو غير مكتمل");const r=await fetch(API+"?token="+encodeURIComponent(token),{cache:"no-store"});const d=await r.json();if(!r.ok||d.status!=="ok")throw Error(d.error||"تعذر العثور على الشحنة");render(d.tracking)}
function render(t){
  renderCompany(t);
  const labels=Array.isArray(t.stageLabels)?t.stageLabels:[],icons=Array.isArray(t.stageIcons)?t.stageIcons:[],visible=Array.isArray(t.stageVisible)?t.stageVisible:labels.map(()=>true),current=Number.isInteger(t.currentStage)?t.currentStage:-1;
  const visibleIndexes=labels.map((_,i)=>i).filter(i=>visible[i]!==false),lastVisible=visibleIndexes[visibleIndexes.length-1]??(labels.length-1),shownCurrent=visibleIndexes.filter(i=>i<=current).pop()??-1;
  const timeline=visibleIndexes.map(i=>{const name=labels[i],entry=[...(t.stages||[])].reverse().find(x=>x.stage===i);const done=i<shownCurrent||current>=lastVisible,now=i===shownCurrent&&current<lastVisible;return `<div class="step ${done?"done":""} ${now?"current":""}"><div class="dot">${done?"✓":esc(icons[i]||"🔹")}</div><div><b>${esc(name)}</b>${entry?`<small>${fmt(entry.at)}${entry.note?" · "+esc(entry.note):""}</small>`:now?"<small>المرحلة الحالية</small>":""}</div></div>`}).join("");
  const status=current<0?"لم يبدأ التنفيذ":current>=lastVisible?"تم التسليم":"جاري التنفيذ";const v=t.vehicle||{},s=t.shipment||{};
  document.getElementById("app").innerHTML=`<section class="card hero"><h1>متابعة الشحنة</h1><p>يمكنك متابعة آخر تحديثات الشحنة ومعلومات النقل والتسليم من هذه الصفحة.</p><span class="state">${current>=labels.length-1?"🟢":current<0?"⏳":"🚚"} ${esc(status)}</span></section>
  <div class="tracking-layout"><aside class="tracking-side"><section class="card"><h2>بيانات التحميل والنقل</h2><div class="grid">${field("نوع السيارة",v.truckType)}${field("رقم السيارة",v.truck)}${field("اسم السائق",v.driver)}${phoneField(v.phone)}${field("رقم إذن التحميل",s.loadingPermitNo)}${field("الكمية المحملة",s.loadedQty==null?"—":s.loadedQty+" طن")}${field("تاريخ التحميل",fmt(s.loadingAt))}${field("الوصول المتوقع",fmt(s.eta))}${field("تاريخ التسليم",fmt(s.deliveredAt))}${field("مستلم الشحنة",s.receiver)}${field("ملاحظات التسليم",s.deliveryNote)}</div></section><section class="card"><h2>مستندات الشحنة</h2>${renderDocuments(t.documents)}</section></aside><section class="card tracking-main"><h2>مراحل الشحنة</h2><div class="steps">${timeline||'<p class="muted">لا توجد مراحل معرفة.</p>'}</div></section></div>`;
}
load().catch(e=>document.getElementById("app").innerHTML=`<section class="card error"><div style="font-size:34px">🔒</div><h2>تعذر عرض الشحنة</h2><p class="muted">${esc(e.message||"حدث خطأ")}</p><p class="muted">تأكد من صحة الرابط أو تواصل مع شركة Iron Gate.</p></section>`);
</script></body></html>
