<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14213d">
<title>متابعة الشحنة | Iron Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213d; --navy-2:#1b2a4a; --gold:#c99a24; --gold-2:#e5b43a;
  --bg:#f3f5f9; --surface:#fff; --border:#e5e8ee; --muted:#6b7280; --text:#111827;
  --green:#16a34a; --green-soft:#dcfce7; --red:#dc2626; --red-soft:#fef2f2;
  --blue:#3b82f6; --blue-soft:#eff6ff; --amber:#f59e0b; --amber-soft:#fef3c7;
  --shadow-sm:0 1px 2px rgba(17,24,39,.04),0 1px 3px rgba(17,24,39,.06);
  --shadow:0 4px 14px rgba(17,24,39,.06),0 2px 6px rgba(17,24,39,.04);
  --shadow-lg:0 20px 40px rgba(17,24,39,.08);
  --r:16px; --r-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Cairo',Tahoma,Arial,sans-serif;color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:16px 14px 60px}

/* ========= TOP BAR ========= */
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm);margin-bottom:14px;min-width:0}
.tb-brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.tb-brand .lg{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:var(--navy);display:grid;place-items:center;overflow:hidden;color:#fff;font-weight:900;font-size:16px}
.tb-brand .lg img{width:100%;height:100%;object-fit:contain}
.tb-brand .txt{min-width:0}
.tb-brand .txt b{display:block;font-size:14px;font-weight:800;color:var(--navy);overflow-wrap:anywhere;line-height:1.3}
.tb-brand .txt small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.5px}
.tb-dev{display:flex;align-items:center;gap:8px;direction:ltr;opacity:.75}
.tb-dev img{width:28px;height:28px;border-radius:50%;background:var(--navy);object-fit:contain}
.tb-dev small{font-size:9.5px;color:var(--muted);letter-spacing:.5px;font-weight:700}
@media(max-width:480px){.tb-dev small{display:none}}

/* ========= HERO / ORDER SUMMARY ========= */
.hero{background:linear-gradient(135deg,#1f64b8 0%,#2f7bd3 55%,#4a93e0 100%);color:#fff;border-radius:var(--r);padding:22px 24px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 10px 26px rgba(47,123,211,.28)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(201,154,36,.18),transparent 50%),radial-gradient(circle at 85% 80%,rgba(59,130,246,.12),transparent 55%);pointer-events:none}
.hero-inner{position:relative;display:grid;gap:18px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.hero-main{flex:1 1 300px;min-width:0}
.hero-eyebrow{font-size:11px;color:#eaf3ff;letter-spacing:3px;font-weight:700;margin-bottom:6px;text-transform:uppercase}
.hero h1{font-size:24px;font-weight:900;margin:0 0 6px;letter-spacing:-.3px;overflow-wrap:anywhere}
.hero-eta{margin-top:10px;display:inline-flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.45);border-radius:14px;backdrop-filter:blur(10px)}
.hero-eta .ic{font-size:20px}
.hero-eta b{font-size:16px;font-weight:800}
.hero-eta small{display:block;font-size:11px;color:#eaf3ff}
.hero-status{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:800;background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.5);white-space:nowrap}
.hero-status.delivered{background:var(--green);border-color:var(--green)}
.hero-status.inprogress{background:var(--amber);border-color:var(--amber);color:#1a150c}
.hero-status.pending{background:rgba(255,255,255,.26)}
.hero-dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ========= Horizontal progress stepper (desktop) ========= */
.hero-progress{position:relative;padding:10px 4px 4px}
.hp-track{position:relative;height:6px;background:rgba(255,255,255,.32);border-radius:999px;overflow:hidden;margin:0 24px}
.hp-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:999px;transition:width .6s cubic-bezier(.3,.8,.3,1);box-shadow:0 0 12px rgba(229,180,58,.5)}
.hp-pct{text-align:center;margin-top:8px;font-size:13px;color:#eaf3ff}
.hp-pct b{color:#fff;font-weight:800;font-size:15px}

/* ========= Grid layout ========= */
.grid-main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:14px;align-items:start}
@media(max-width:820px){.grid-main{grid-template-columns:1fr}}

/* ========= Cards ========= */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:0;margin-bottom:14px;box-shadow:var(--shadow-sm);overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);background:#fafbfc}
.card-head h2{margin:0;font-size:15px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px}
.card-head small{color:var(--muted);font-size:11.5px}
.card-body{padding:18px}

/* ========= TIMELINE (Amazon/Noon style) ========= */
.timeline{position:relative}
.tl-step{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:flex-start;padding:14px 0;position:relative}
.tl-step:not(:last-child)::before{content:"";position:absolute;right:21px;top:52px;bottom:-4px;width:2px;background:var(--border);border-radius:999px}
.tl-step.done:not(:last-child)::before{background:var(--green)}
.tl-step.current:not(:last-child)::before{background:linear-gradient(180deg,var(--gold),var(--border))}

.tl-dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#f3f5f9;color:var(--muted);font-size:17px;border:3px solid #fff;outline:1px solid var(--border);position:relative;z-index:1;transition:.25s;flex:0 0 44px}
.tl-step.done .tl-dot{background:var(--green);color:#fff;outline-color:var(--green);box-shadow:0 2px 10px rgba(22,163,74,.3)}
.tl-step.current .tl-dot{background:var(--gold);color:#fff;outline-color:var(--gold);box-shadow:0 0 0 4px rgba(201,154,36,.2);animation:pulse-ring 2s infinite}
@keyframes pulse-ring{0%,100%{box-shadow:0 0 0 4px rgba(201,154,36,.2)}50%{box-shadow:0 0 0 10px rgba(201,154,36,.05)}}

.tl-body{min-width:0;padding-top:8px}
.tl-body b{display:block;font-size:14px;color:var(--text);font-weight:800;overflow-wrap:anywhere}
.tl-step.done .tl-body b{color:var(--navy)}
.tl-step.current .tl-body b{color:var(--navy);font-weight:900}
.tl-step:not(.done):not(.current) .tl-body b{color:var(--muted)}
.tl-body small{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.6}
.tl-body .tl-note{display:inline-block;margin-top:5px;padding:4px 10px;background:#f3f5f9;border-radius:8px;font-size:11.5px;color:#374151}

.tl-time{font-size:11px;color:var(--muted);text-align:left;padding-top:14px;white-space:nowrap;direction:ltr}

/* ========= Info Grid ========= */
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.info-cell{background:#fafbfc;border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:0;transition:.15s}
.info-cell:hover{border-color:var(--gold);background:#fffbf1}
.info-cell small{display:block;color:var(--muted);font-size:10.5px;font-weight:700;margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase}
.info-cell b{display:block;color:var(--navy);font-size:13.5px;font-weight:800;overflow-wrap:anywhere;line-height:1.4}
.info-cell a{display:inline-block;margin-top:6px;padding:4px 10px;background:var(--navy);color:#fff;border-radius:8px;font-size:11.5px;font-weight:700;text-decoration:none}
.info-cell a:hover{background:var(--navy-2)}

/* ========= Driver / Vehicle card ========= */
.driver-card{display:flex;align-items:center;gap:14px;padding:14px;background:linear-gradient(135deg,#fffbf0,#fff8e1);border:1px solid #f0d88c;border-radius:14px}
.driver-avatar{width:54px;height:54px;flex:0 0 54px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-2));display:grid;place-items:center;color:#fff;font-size:22px;font-weight:900;box-shadow:0 4px 12px rgba(201,154,36,.3)}
.driver-info{flex:1;min-width:0}
.driver-info b{display:block;font-size:14px;color:var(--navy);font-weight:800;overflow-wrap:anywhere}
.driver-info small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.driver-contact{display:flex;gap:6px;flex-shrink:0}
.driver-contact a{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--border);display:grid;place-items:center;text-decoration:none;color:var(--navy);font-size:18px;transition:.15s}
.driver-contact a.call{color:var(--green);border-color:#86efac}
.driver-contact a.call:hover{background:#f0fdf4;transform:scale(1.08)}
.driver-contact a.wa{color:#25d366;border-color:#86efac}
.driver-contact a.wa:hover{background:#f0fdf4;transform:scale(1.08)}

/* ========= Documents ========= */
.docs-list{display:grid;gap:9px}
.doc-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fafbfc;border:1px solid var(--border);border-radius:12px;transition:.15s;min-width:0}
.doc-item:hover{border-color:var(--gold);background:#fffbf1;transform:translateX(-2px)}
.doc-ic{width:42px;height:42px;flex:0 0 42px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,#f3f5f9,#e5e8ee);color:var(--navy)}
.doc-ic.pdf{background:linear-gradient(135deg,#fef2f2,#fecaca);color:var(--red)}
.doc-ic.img{background:linear-gradient(135deg,#eff6ff,#bfdbfe);color:var(--blue)}
.doc-ic.sig{background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:var(--green)}
.doc-meta{flex:1;min-width:0}
.doc-meta b{display:block;font-size:13px;color:var(--navy);font-weight:800;overflow-wrap:anywhere}
.doc-meta small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.doc-item a{flex:0 0 auto;padding:7px 14px;background:var(--navy);color:#fff;border-radius:8px;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
.doc-item a:hover{background:var(--navy-2)}

/* ========= Empty & Loading ========= */
.empty{text-align:center;padding:30px 20px;color:var(--muted)}
.empty .emoji{font-size:38px;opacity:.5;margin-bottom:8px}
.error-screen{text-align:center;padding:60px 20px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm);max-width:420px;margin:30px auto}
.spinner{width:36px;height:36px;border:3px solid #e8eaf0;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ========= Signature Card ========= */
.sig-card{background:linear-gradient(145deg,#fffbf0,#fff8e1);border:2px dashed var(--gold);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.sig-card h2{color:#8a6500;margin:0 0 8px;display:flex;align-items:center;gap:10px;font-size:18px;font-weight:900}
.sig-sub{color:#5b4a10;font-size:13.5px;line-height:1.75;margin-bottom:16px}
.sig-canvas-wrap{background:#fff;border:2px solid var(--gold);border-radius:12px;padding:6px;position:relative;touch-action:none}
.sig-canvas{display:block;width:100%;height:240px;border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
.sig-placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#c4a76b;font-size:15px;font-weight:700;pointer-events:none;letter-spacing:1px}
.sig-placeholder.hidden{display:none}
.sig-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.sig-btn{border:none;border-radius:12px;padding:14px 20px;font:inherit;font-weight:800;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
.sig-btn.primary{background:linear-gradient(135deg,var(--green),#15803d);color:#fff;flex:1;min-width:200px;box-shadow:0 4px 12px rgba(22,163,74,.3)}
.sig-btn.primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(22,163,74,.4)}
.sig-btn.primary:disabled{opacity:.45;cursor:not-allowed}
.sig-btn.ghost{background:#fff;color:#8a6500;border:1px solid var(--gold)}
.sig-btn.ghost:hover{background:#fffbf1}
.sig-done{background:var(--green-soft);border:1px solid #86efac;border-radius:var(--r);padding:16px;color:#105f3f;display:flex;align-items:center;gap:14px;margin-bottom:14px;font-size:14px;font-weight:800;box-shadow:var(--shadow-sm)}
.sig-done .ic{font-size:28px;flex:0 0 auto}
.sig-done .txt{flex:1}
.sig-done small{display:block;font-weight:400;opacity:.8;font-size:11.5px;margin-top:2px}
.sig-done img{max-width:120px;max-height:60px;background:#fff;border:1px solid #c5ead8;border-radius:8px;padding:4px;flex:0 0 auto}

/* ========= Receipt-style delivery summary ========= */
.receipt{background:#fff;border-radius:var(--r);padding:18px;border:1px dashed #cfd8e3;margin-top:14px}
.receipt .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #e5e8ee;font-size:13px}
.receipt .row:last-child{border-bottom:0;padding-top:12px;font-weight:800;color:var(--navy);font-size:14.5px}
.receipt .row small{color:var(--muted);font-weight:600}

.cc{overflow:hidden}
.cc-head{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;cursor:pointer;background:#fafbfc;font-family:inherit}
.cc-head:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.cc-t{flex:1;min-width:0}
.cc-t b{display:block;font-size:15px;font-weight:800;color:var(--navy)}
.cc-t small{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-weight:600}
.cc-t .h-o{display:none}
.cc.open .cc-t .h-o{display:inline}
.cc.open .cc-t .h-c{display:none}
.cc-arrow{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1;color:var(--red);background:var(--red-soft);border:1px solid #fecaca;transition:transform .25s,color .2s,background .2s,border-color .2s}
.cc.open .cc-arrow{transform:rotate(180deg);color:var(--green);background:var(--green-soft);border-color:#86efac}
.cc-body{display:none;border-top:1px solid var(--border)}
.cc.open .cc-body{display:block}
.iw-table{width:100%;border-collapse:collapse;font-size:13px}
.iw-table th{background:#fafbfc;color:var(--muted);font-size:11px;font-weight:700;text-align:right;padding:9px 10px;border-bottom:1px solid var(--border)}
.iw-table td{padding:10px;border-bottom:1px solid var(--border);color:var(--navy);font-weight:700}
.iw-table td.n{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.iw-table tfoot td{background:#fffbf1;font-weight:900;border-bottom:0}
.iw-wrap{overflow-x:auto}
.iw-table td.neg{color:#dc2626}.iw-table td.pos{color:#16a34a}
/* ========= Footer ========= */
.site-footer{text-align:center;padding:20px 14px;color:var(--muted);font-size:11.5px;letter-spacing:.3px}
.site-footer b{color:var(--navy);font-weight:800}

/* ========= Mobile tweaks ========= */
@media(max-width:560px){
  .wrap{padding:12px 10px 40px}
  .hero{padding:18px 18px;border-radius:14px}
  .hero h1{font-size:19px}
  .hero-eta b{font-size:14px}
  .card-head{padding:12px 14px}
  .card-head h2{font-size:14px}
  .card-body{padding:14px}
  .tl-step{grid-template-columns:40px 1fr;gap:10px}
  .tl-dot{width:40px;height:40px;flex-basis:40px}
  .tl-step::before{right:19px!important}
  .tl-time{grid-column:2;text-align:right;padding-top:0;margin-top:4px}
  .driver-card{padding:12px}
  .driver-avatar{width:46px;height:46px;flex-basis:46px;font-size:18px}
  .doc-ic{width:36px;height:36px;flex-basis:36px;font-size:17px}
}

/* ========= COMPACT (تصغير الصفحة) ========= */
body{font-size:13px;line-height:1.45}
.wrap{padding:10px 10px 40px;max-width:1080px}
.topbar{padding:8px 12px;margin-bottom:10px;border-radius:12px}
.tb-brand .lg{width:32px;height:32px;flex-basis:32px;font-size:13px;border-radius:8px}
.tb-brand .txt b{font-size:12.5px}
.tb-brand .txt small{font-size:9.5px}
.tb-dev img{width:22px;height:22px}
.hero{padding:12px 16px;margin-bottom:10px;border-radius:14px}
.hero-inner{gap:8px}
.hero-top{gap:8px;align-items:center}
.hero-main{flex:1 1 220px}
.hero-eyebrow{font-size:10px;letter-spacing:1.5px;margin-bottom:2px}
.hero h1{font-size:17px;margin:0 0 2px;line-height:1.3}
.hero-sub{font-size:12px;color:#f4f8ff;font-weight:700}
.hero-sub b{color:var(--gold-2);font-weight:900}
.hero-eta{margin-top:6px;padding:5px 10px;gap:7px;border-radius:10px}
.hero-eta .ic{font-size:14px}
.hero-eta b{font-size:12.5px}
.hero-eta small{font-size:10px}
.hero-status{padding:5px 12px;font-size:11.5px}
.hero-progress{padding:2px 2px 0}
.hp-track{height:5px;margin:0 6px}
.hp-pct{margin-top:4px;font-size:11px}
.hp-pct b{font-size:12.5px}
.grid-main{gap:10px}
.card{margin-bottom:10px;border-radius:12px}
.card-head{padding:9px 14px}
.card-head h2{font-size:13px}
.card-head small{font-size:10.5px}
.card-body{padding:12px 14px}
.cc-head{padding:10px 14px}
.cc-t b{font-size:13px}
.cc-t small{font-size:11px}
.cc-arrow{flex-basis:28px;width:28px;height:28px;font-size:12px}
.tl-step{grid-template-columns:34px 1fr auto;gap:10px;padding:8px 0}
.tl-step:not(:last-child)::before{right:16px;top:40px}
.tl-dot{width:34px;height:34px;flex-basis:34px;font-size:14px}
.tl-body{padding-top:5px}
.tl-body b{font-size:12.5px}
.tl-body small{font-size:11px}
.tl-body .tl-note{font-size:10.5px;padding:3px 8px}
.tl-time{font-size:10px;padding-top:8px}
.info-grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.info-cell{padding:8px 10px}
.info-cell small{font-size:9.5px;margin-bottom:3px}
.info-cell b{font-size:12px}
.driver-card{padding:10px;gap:10px}
.driver-avatar{width:40px;height:40px;flex-basis:40px;font-size:17px}
.driver-info b{font-size:12.5px}
.driver-info small{font-size:10.5px}
.driver-contact a{width:34px;height:34px;font-size:15px}
.doc-item{padding:8px 10px;gap:9px}
.doc-ic{width:34px;height:34px;flex-basis:34px;font-size:16px}
.doc-meta b{font-size:12px}
.doc-meta small{font-size:10px}
.doc-item a{padding:5px 11px;font-size:11px}
.iw-table{font-size:12px}
.iw-table th{font-size:10px;padding:7px 8px}
.iw-table td{padding:8px}
.receipt{padding:12px;margin-top:0}
.receipt .row{font-size:12px;padding:5px 0}
.receipt .row:last-child{font-size:13px}
.sig-card{padding:14px}
.sig-card h2{font-size:15px}
.sig-sub{font-size:12px;margin-bottom:10px}
.sig-canvas{height:180px}
.sig-btn{padding:10px 16px;font-size:13px}
.sig-done{padding:12px;font-size:13px}
.empty{padding:18px 12px;font-size:12px}
.site-footer{padding:12px;font-size:10.5px}

/* ========= v2: ألوان البطاقات + لفت النظر لـ «اضغط هنا» ========= */
.cc.sky{border-color:#bfdcf7}
.cc.sky .cc-head{background:linear-gradient(135deg,#e3f1fd,#d3e8fb)}
.cc.sky .cc-t b{color:#12467f}
.cc.amber{border-color:#f0d88c}.cc.amber .cc-head{background:linear-gradient(135deg,#fff8e1,#fdf0c4)}

/* ===== جرس الملاحظات ===== */
.tb-bell{position:relative;border:0;background:#fff7e0;border:1px solid #f0d88c;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;display:grid;place-items:center;flex:0 0 44px;margin-inline-end:8px;font-family:inherit}
.tb-bell .bd{position:absolute;top:-5px;inset-inline-start:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#dc2626;color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 0 0 0 rgba(220,38,38,.6)}

.tb-bell-tip{position:absolute;top:52px;inset-inline-start:0;white-space:nowrap;background:#dc2626;color:#fff;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:8px;animation:tipFloat 1.6s ease-in-out infinite;z-index:5;pointer-events:none}

@media(prefers-reduced-motion:reduce){.tb-bell.ring .bi,.tb-bell.ring .bd,.tb-bell-tip{animation:none}}

<body>
<main class="wrap">

<!-- Top bar: customer + developer -->
<header class="topbar">
  <div class="tb-brand">
    <div class="lg" id="customerCompanyMark">IG</div>
    <div class="txt">
      <b id="customerCompanyName">جاري تحميل اسم الشركة...</b>
      <small>IRON GATE SUPPLIES</small>
    </div>
  </div>
  <div id="bellWrap" style="position:relative;display:none"></div>
  <div class="tb-dev">
    <img src="developer-logo.webp" alt="H2M+" onerror="this.style.display='none'">
    <small>POWERED BY<br>H2M+ ERP</small>
  </div>
</header>

<div id="app">
  <section class="error-screen">
    <div class="spinner"></div>
    <b>جاري تحميل بيانات الشحنة...</b>
  </section>
</div>

<footer class="site-footer">
  <b>H2M+ ERP Systems</b> · Premium Business Solutions<br>
  صفحة متابعة الشحنة — عرض آمن للعميل
</footer>
</main>

<div class="nt-back" id="ntBack" onclick="if(event.target===this)ntClose()"><div class="nt-box" role="dialog" aria-modal="true" aria-label="ملاحظات"><div class="nt-head"><b>🔔 ملاحظات لك</b><button type="button" class="nt-x" onclick="ntClose()" aria-label="إغلاق">✕</button></div><div id="ntList"></div></div></div>

<script>
const API = "https://wadovjghevemdmqkhhml.supabase.co/functions/v1/shipment-track";
let CURRENT_TOKEN = "";
let LATEST = null;

const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = v => {
  if (!v) return "—";
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? "—" : d.toLocaleString("ar-EG", {dateStyle:"medium", timeStyle:"short"});
};
const fmtDate = v => {
  if (!v) return "—";
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? "—" : d.toLocaleDateString("ar-EG", {dateStyle:"medium"});
};
const fmtTime = v => {
  if (!v) return "";
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? "" : d.toLocaleTimeString("ar-EG", {hour:"2-digit", minute:"2-digit"});
};

function safeLogo(v) {
  const s = String(v||"").trim();
  if (/^https:\/\//i.test(s) && !/["'<>]/.test(s)) return s;
  if (/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=\r\n]+$/i.test(s)) return s;
  return "";
}

function renderBrand(t) {
  const n = String(t.companyName||"").trim();
  const nameEl = document.getElementById("customerCompanyName");
  if (nameEl) nameEl.textContent = n || "اسم الشركة غير محدد";
  const mark = document.getElementById("customerCompanyMark");
  const logo = safeLogo(t.companyLogo);
  if (mark && logo) {
    mark.innerHTML = `<img src="${esc(logo)}" alt="شعار الشركة" onerror="this.remove();this.parentNode.textContent='IG'">`;
  } else if (mark) {
    mark.textContent = (n.slice(0,2) || "IG").toUpperCase();
  }
}

function etaInfo(etaStr) {
  if (!etaStr) return null;
  const eta = new Date(etaStr).getTime();
  if (isNaN(eta)) return null;
  const diff = eta - Date.now();
  if (diff > 0) {
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const d = Math.floor(h / 24);
    let txt = "";
    if (d >= 1) txt = `خلال ${d} يوم${d>1?"":""} و ${h%24} ساعة`;
    else if (h >= 1) txt = `خلال ${h} ساعة و ${m} دقيقة`;
    else txt = `خلال ${Math.max(1,m)} دقيقة`;
    return {text:txt, late:false, date:fmt(etaStr)};
  }
  // لا نعرض أي تأخير للعميل: لو الموعد عدّى ما بنظهرش حاجة
  return null;
}

function hasSignature(docs) {
  return Array.isArray(docs) && docs.some(d => String(d.category||"").includes("توقيع"));
}
function existingSignature(docs) {
  return (docs||[]).find(d => String(d.category||"").includes("توقيع"));
}

function docIconClass(doc) {
  const mime = String(doc.mimeType||doc.mime||"").toLowerCase();
  const cat = String(doc.category||"");
  if (cat.includes("توقيع")) return "sig";
  if (mime.includes("pdf")) return "pdf";
  return "img";
}
function docIcon(doc) {
  const cat = String(doc.category||"");
  if (cat.includes("توقيع")) return "✍️";
  const mime = String(doc.mimeType||doc.mime||"").toLowerCase();
  if (mime.includes("pdf")) return "📕";
  if (mime.includes("image")) return "🖼️";
  return "📄";
}

const OPEN_CARDS = new Set();
function ccHtml(id, icon, title, hint, bodyHtml, badge, cls) {
  const open = OPEN_CARDS.has(id);
  return `<div class="card cc ${cls || ""} ${open ? "open" : ""}" id="cc_${id}">
    <button type="button" class="cc-head" onclick="ccToggle('${id}')" aria-expanded="${open}">
      <span class="cc-t"><b>${icon} ${title}</b><small><span class="h-c">${hint}</span><span class="h-o">اضغط هنا للإخفاء</span></small></span>
      ${badge ? `<small style="color:var(--muted);font-size:11.5px">${badge}</small>` : ""}
      <span class="cc-arrow" aria-hidden="true">▼</span>
    </button>
    <div class="cc-body"><div class="card-body">${bodyHtml}</div></div>
  </div>`;
}
function ccToggle(id) {
  const el = document.getElementById("cc_" + id);
  if (!el) return;
  const open = el.classList.toggle("open");
  open ? OPEN_CARDS.add(id) : OPEN_CARDS.delete(id);
  const b = el.querySelector(".cc-head"); if (b) b.setAttribute("aria-expanded", open);
}

function orderItemsTable(s) {
  const rows = (Array.isArray(s.itemWeights) ? s.itemWeights : []).filter(x => x && Number(x.weight) > 0);
  if (!rows.length) return {html:"", count:0};
  const nf = n => Number(n).toLocaleString("en-US", {minimumFractionDigits:3, maximumFractionDigits:3});
  const total = rows.reduce((a, x) => a + Number(x.weight), 0);
  const hasQty = rows.some(x => Number(x.qty) > 0);
  const df = (q, w) => { if (!(Number(q) > 0)) return `<td class="n">—</td>`; const d = Math.round((Number(w) - Number(q)) * 1000) / 1000; return `<td class="n ${d < 0 ? "neg" : d > 0 ? "pos" : ""}">${d > 0 ? "+" : d < 0 ? "−" : ""}${nf(Math.abs(d))}</td>`; };
  const totQty = rows.reduce((a, x) => a + (Number(x.qty) > 0 ? Number(x.qty) : 0), 0);
  const totW = rows.reduce((a, x) => a + (Number(x.qty) > 0 ? Number(x.weight) : 0), 0);
  const html = `<div class="iw-wrap"><table class="iw-table">
      <thead><tr><th>م</th><th>القطر</th><th>النوع</th>${hasQty ? "<th>كمية التوريد (طن)</th>" : ""}<th>الوزن الفعلي (طن)</th>${hasQty ? "<th>الفرق</th>" : ""}</tr></thead>
      <tbody>${rows.map((x,i) => `<tr><td>${i+1}</td><td>${esc(x.diameter||"—")}</td><td>${esc(x.type||"—")}</td>${hasQty ? `<td class="n">${Number(x.qty) > 0 ? nf(x.qty) : "—"}</td>` : ""}<td class="n">${nf(x.weight)}</td>${hasQty ? df(x.qty, x.weight) : ""}</tr>`).join("")}</tbody>
      <tfoot><tr><td colspan="3">الإجمالي</td>${hasQty ? `<td class="n">${nf(totQty)}</td>` : ""}<td class="n">${nf(total)}</td>${hasQty ? df(totQty, totW) : ""}</tr></tfoot>
    </table></div>`;
  return {html, count:rows.length};
}

function renderDocs(docs) {
  const items = (Array.isArray(docs) ? docs : []).filter(d => !String(d.category||"").includes("توقيع"));
  if (!items.length) {
    return `<div class="empty"><div class="emoji">📂</div>لا توجد مستندات متاحة حاليًا</div>`;
  }
  return `<div class="docs-list">${items.map((doc,i) => {
    const name = esc(doc.fileName || doc.name || `مستند ${i+1}`);
    const url = String(doc.url||"");
    const safe = /^https:\/\//i.test(url) && !/["'<>]/.test(url) ? esc(url) : "";
    return `<div class="doc-item">
      <div class="doc-ic ${docIconClass(doc)}">${docIcon(doc)}</div>
      <div class="doc-meta">
        <b>${name}</b>
        <small>${esc(doc.category||"مرفق")} · ${esc(fmt(doc.createdAt||doc.at))}</small>
      </div>
      ${safe ? `<a href="${safe}" target="_blank" rel="noopener noreferrer">عرض</a>` : `<small style="color:var(--muted)">غير متاح</small>`}
    </div>`;
  }).join("")}</div>`;
}

// ============ Signature Capture ============
function signatureCardHtml() {
  return `<section class="sig-card" id="sigCard">
    <h2>✍️ توقيع استلام الشحنة</h2>
    <div class="sig-sub">الشحنة وصلت إلى موقعك. يُرجى التوقيع داخل المربع بإصبعك (موبايل) أو الماوس (كمبيوتر)، ثم الضغط على زرار التأكيد. التوقيع يُعتبر إثبات رسمي لاستلام البضاعة.</div>
    <div class="sig-canvas-wrap">
      <canvas class="sig-canvas" id="sigCanvas"></canvas>
      <div class="sig-placeholder" id="sigPlaceholder">وقّع هنا ✍️</div>
    </div>
    <div class="sig-actions">
      <button type="button" class="sig-btn ghost" onclick="sigClear()">🧹 مسح</button>
      <button type="button" class="sig-btn primary" id="sigSubmit" onclick="sigSubmit()" disabled>✅ تأكيد الاستلام</button>
    </div>
    <div id="sigMsg" style="margin-top:10px;font-size:13px;font-weight:700;text-align:center;min-height:18px"></div>
  </section>`;
}
function existingSignatureHtml(docs) {
  const sig = existingSignature(docs);
  if (!sig) return "";
  const url = String(sig.url||"");
  const safe = /^https:\/\//i.test(url) && !/["'<>]/.test(url) ? url : "";
  return `<div class="sig-done">
    <div class="ic">✓</div>
    <div class="txt">تم استلام الشحنة وتوقيعها إلكترونيًا<br><small>${esc(fmt(sig.createdAt||sig.at))}</small></div>
    ${safe ? `<img src="${esc(safe)}" alt="التوقيع">` : ""}
  </div>`;
}
let SIG_CTX=null, SIG_CANVAS=null, SIG_DRAWING=false, SIG_HAS_INK=false, SIG_LAST=null;
function sigInit() {
  SIG_CANVAS = document.getElementById('sigCanvas');
  if (!SIG_CANVAS) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = SIG_CANVAS.getBoundingClientRect();
  SIG_CANVAS.width = Math.floor(rect.width * dpr);
  SIG_CANVAS.height = Math.floor(rect.height * dpr);
  SIG_CTX = SIG_CANVAS.getContext('2d');
  SIG_CTX.scale(dpr, dpr);
  SIG_CTX.lineWidth = 2.8;
  SIG_CTX.lineCap = 'round';
  SIG_CTX.lineJoin = 'round';
  SIG_CTX.strokeStyle = '#14213d';
  SIG_HAS_INK = false;
  const getPos = e => {
    const r = SIG_CANVAS.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x: p.clientX - r.left, y: p.clientY - r.top};
  };
  const start = e => {
    e.preventDefault();
    SIG_DRAWING = true;
    SIG_LAST = getPos(e);
    document.getElementById('sigPlaceholder')?.classList.add('hidden');
  };
  const move = e => {
    if (!SIG_DRAWING) return;
    e.preventDefault();
    const p = getPos(e);
    SIG_CTX.beginPath();
    SIG_CTX.moveTo(SIG_LAST.x, SIG_LAST.y);
    SIG_CTX.lineTo(p.x, p.y);
    SIG_CTX.stroke();
    SIG_LAST = p;
    SIG_HAS_INK = true;
    document.getElementById('sigSubmit').disabled = false;
  };
  const end = e => {
    if (e) e.preventDefault();
    SIG_DRAWING = false;
    SIG_LAST = null;
  };
  SIG_CANVAS.addEventListener('mousedown', start);
  SIG_CANVAS.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  SIG_CANVAS.addEventListener('touchstart', start, {passive:false});
  SIG_CANVAS.addEventListener('touchmove', move, {passive:false});
  SIG_CANVAS.addEventListener('touchend', end, {passive:false});
}
function sigClear() {
  if (!SIG_CTX || !SIG_CANVAS) return;
  SIG_CTX.save();
  SIG_CTX.setTransform(1, 0, 0, 1, 0, 0);
  SIG_CTX.clearRect(0, 0, SIG_CANVAS.width, SIG_CANVAS.height);
  SIG_CTX.restore();
  SIG_HAS_INK = false;
  document.getElementById('sigSubmit').disabled = true;
  document.getElementById('sigPlaceholder')?.classList.remove('hidden');
}
async function sigSubmit() {
  if (!SIG_CANVAS || !SIG_HAS_INK) return;
  const btn = document.getElementById('sigSubmit');
  const msg = document.getElementById('sigMsg');
  btn.disabled = true;
  btn.textContent = '⏳ جاري الحفظ...';
  msg.textContent = '';
  msg.style.color = '';
  try {
    const out = document.createElement('canvas');
    out.width = SIG_CANVAS.width;
    out.height = SIG_CANVAS.height;
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(SIG_CANVAS, 0, 0);
    const dataUrl = out.toDataURL('image/png');
    const r = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action:'customer_signature', token:CURRENT_TOKEN, signature:dataUrl})
    });
    const j = await r.json();
    if (!r.ok || j.error) {
      msg.style.color = '#b91c1c';
      msg.textContent = '❌ ' + (j.error || 'تعذر حفظ التوقيع');
      btn.disabled = false;
      btn.textContent = '✅ تأكيد الاستلام';
      return;
    }
    msg.style.color = '#105f3f';
    msg.textContent = '✅ تم حفظ التوقيع بنجاح. شكرًا لك!';
    setTimeout(() => load().catch(() => {}), 1200);
  } catch (e) {
    msg.style.color = '#b91c1c';
    msg.textContent = '❌ خطأ في الاتصال: ' + (e.message || e);
    btn.disabled = false;
    btn.textContent = '✅ تأكيد الاستلام';
  }
}

async function load() {
  const qs = new URLSearchParams(location.search);
  CURRENT_TOKEN = qs.get("t") || qs.get("token") || "";
  if (!/^[A-Za-z0-9_-]{20,64}$/.test(CURRENT_TOKEN)) throw Error("رابط المتابعة غير صحيح أو غير مكتمل");
  const r = await fetch(API + "?token=" + encodeURIComponent(CURRENT_TOKEN), {cache: "no-store"});
  const d = await r.json();
  if (!r.ok || d.status !== "ok") throw Error(d.error || "تعذر العثور على الشحنة");
  LATEST = d.tracking;
  render(d.tracking);
}


// ============ جرس الملاحظات ============
let NOTES = [];
const ntKey = () => "ig_notes_read_" + CURRENT_TOKEN.slice(0, 24);
function ntReadSet() { try { return new Set(JSON.parse(localStorage.getItem(ntKey()) || "[]")); } catch (e) { return new Set(); } }
function ntSaveRead(set) { try { localStorage.setItem(ntKey(), JSON.stringify([...set])); } catch (e) {} }
function renderBell(notes) {
  NOTES = Array.isArray(notes) ? notes : [];
  const w = document.getElementById("bellWrap"); if (!w) return;
  if (!NOTES.length) { w.style.display = "none"; w.innerHTML = ""; return; }
  const read = ntReadSet(), unread = NOTES.filter(n => !read.has(n.id)).length;
  w.style.display = "block";
  w.innerHTML = `<button type="button" class="tb-bell ${unread ? "ring" : ""}" onclick="ntOpen()" aria-label="الملاحظات">
      <span class="bi">🔔</span>${unread ? `<span class="bd">${unread}</span>` : ""}</button>
    ${unread ? `<span class="tb-bell-tip">لديك ${unread > 1 ? unread + " ملاحظات جديدة" : "ملاحظة جديدة"}</span>` : ""}`;
}
function ntOpen() {
  const read = ntReadSet();
  document.getElementById("ntList").innerHTML = NOTES.slice().reverse().map(n =>
    `<div class="nt-item ${read.has(n.id) ? "" : "new"}"><p>${esc(n.text)}</p><small>${esc(fmt(n.at))}</small></div>`).join("");
  document.getElementById("ntBack").classList.add("open");
  NOTES.forEach(n => read.add(n.id)); ntSaveRead(read);
  renderBell(NOTES);
  ntReport();
}
// إبلاغ الشركة إن العميل فتح الملاحظات (بيعيد المحاولة تلقائيًا لو فشل)
const ntRepKey = () => "ig_notes_rep_" + CURRENT_TOKEN.slice(0, 24);
async function ntReport() {
  let rep; try { rep = new Set(JSON.parse(localStorage.getItem(ntRepKey()) || "[]")); } catch (e) { rep = new Set(); }
  const read = ntReadSet(), ids = NOTES.map(n => n.id).filter(id => read.has(id) && !rep.has(id));
  if (!ids.length) return;
  try {
    const r = await fetch(API, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({action: "notes_read", token: CURRENT_TOKEN, ids})});
    if (!r.ok) return;
    ids.forEach(id => rep.add(id));
    try { localStorage.setItem(ntRepKey(), JSON.stringify([...rep])); } catch (e) {}
  } catch (e) {}
}
function ntClose() { document.getElementById("ntBack").classList.remove("open"); }

function render(t) {
  renderBrand(t);
  renderBell(t.notes);
  ntReport();

  const labels = Array.isArray(t.stageLabels) ? t.stageLabels : [];
  const icons = Array.isArray(t.stageIcons) ? t.stageIcons : [];
  const visible = Array.isArray(t.stageVisible) ? t.stageVisible : labels.map(() => true);
  const current = Number.isInteger(t.currentStage) ? t.currentStage : -1;

  // Only visible stages — hidden ones are excluded entirely
  const visIdx = labels.map((_, i) => i).filter(i => visible[i] !== false);
  const lastVis = visIdx[visIdx.length - 1] ?? (labels.length - 1);
  const shownCurrent = visIdx.filter(i => i <= current).pop() ?? -1;
  const doneCount = current >= lastVis ? visIdx.length : (shownCurrent >= 0 ? visIdx.indexOf(shownCurrent) + 1 : 0);
  const pct = visIdx.length ? Math.round((doneCount / visIdx.length) * 100) : 0;

  // Status text
  let statusText, statusClass;
  if (current >= lastVis) { statusText = "تم التسليم"; statusClass = "delivered"; }
  else if (current < 0) { statusText = "لم يبدأ التنفيذ"; statusClass = "pending"; }
  else { statusText = "جاري التنفيذ"; statusClass = "inprogress"; }

  const v = t.vehicle || {};
  const s = t.shipment || {};
  // موعد الوصول المتوقع: لو مساوي أو قبل وقت التحميل يبقى قيمة تلقائية مش موعد حقيقي → ما نعرضوش ولا نعتبره تأخير
  const realEta = (s.eta && !(s.loadingAt && new Date(s.eta).getTime() <= new Date(s.loadingAt).getTime())) ? s.eta : null;
  const eta = etaInfo(realEta);
  const phone = String(v.phone || "").replace(/[^0-9+]/g, "");
  const wa = phone ? phone.replace(/^0/,'20').replace(/^\+/,'') : "";

  // Signature state
  const deliveredNow = current >= lastVis && lastVis >= 0;
  const alreadySigned = hasSignature(t.documents);
  const sigBlock = deliveredNow && !alreadySigned ? signatureCardHtml() : (alreadySigned ? existingSignatureHtml(t.documents) : "");

  // Timeline
  const timeline = visIdx.map(i => {
    const name = labels[i];
    const done = i < shownCurrent || current >= lastVis;
    const now = i === shownCurrent && current < lastVis;
    const entry = [...(t.stages || [])].reverse().find(x => x.stage === i);
    const stateCls = done ? "done" : (now ? "current" : "pending");
    const iconStr = done ? "✓" : (icons[i] || "🔹");
    const dateStr = entry ? `<span class="tl-time">${esc(fmtDate(entry.at))}<br><small style="opacity:.7">${esc(fmtTime(entry.at))}</small></span>` : (now ? `<span class="tl-time" style="color:var(--gold);font-weight:800">الآن</span>` : "");
    const noteStr = entry && entry.note ? `<span class="tl-note">💬 ${esc(entry.note)}</span>` : "";
    return `<div class="tl-step ${stateCls}">
      <div class="tl-dot">${esc(iconStr)}</div>
      <div class="tl-body"><b>${esc(name)}</b>${noteStr || (now ? `<small>⏳ قيد التنفيذ الآن</small>` : "")}</div>
      ${dateStr}
    </div>`;
  }).join("");

  // بيانات السائق (كارت لوحده) — كل بيان بأيقونة واسم واضح
  const drRow = (ic, lbl, val, cls) => `<div class="dr-row"><span class="dr-ic ${cls||""}">${ic}</span><div class="dr-t"><small>${lbl}</small><b>${val}</b></div></div>`;
  const driverCard = (v.driver || v.truck || v.phone || v.truckType) ? ccHtml("driver", "👤", "بيانات السائق", "اضغط هنا لترى اسم السائق وتليفونه ورقم السيارة", `
      <div class="dr-rows">
        ${v.driver ? drRow("👤", "اسم السائق", esc(v.driver)) : ""}
        ${phone ? drRow("📞", "تليفون السائق", `<span class="dr-phone">${esc(phone)}</span>`, "ph") : ""}
        ${v.truckType ? drRow("🚚", "نوع السيارة", esc(v.truckType)) : ""}
        ${v.truck ? drRow("🔢", "رقم السيارة", esc(v.truck)) : ""}
      </div>
      ${phone ? `<div class="dr-actions">
        <a class="dr-btn call" href="tel:${esc(phone)}">📞 اتصال بالسائق</a>
        <a class="dr-btn wa" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">💬 واتساب</a>
      </div>` : ""}`, v.driver ? "👤 " + esc(v.driver) : "", "violet") : "";

  // بيانات الطلبية: كل صنف في سطر (كمية التوريد + الوزن الفعلي) + بيانات التحميل
  const itemsT = orderItemsTable(s);
  const loadCells = !deliveredNow ? `
      ${s.loadingPermitNo ? `<div class="info-cell"><small>رقم إذن التحميل</small><b>${esc(s.loadingPermitNo)}</b></div>` : ""}
      ${s.loadedQty != null ? `<div class="info-cell"><small>الكمية المحملة</small><b>${esc(s.loadedQty)} طن</b></div>` : ""}
      ${s.loadingAt ? `<div class="info-cell"><small>تاريخ التحميل</small><b>${esc(fmt(s.loadingAt))}</b></div>` : ""}
      ${realEta ? `<div class="info-cell"><small>الوصول المتوقع</small><b>${esc(fmt(realEta))}</b></div>` : ""}` : "";
  const orderCard = (itemsT.count || loadCells.trim())
    ? ccHtml("order", "📦", "بيانات الطلبية", "اضغط هنا لترى الأصناف وكمية التوريد والوزن الفعلي",
        (itemsT.html || "") + (loadCells.trim() ? `<div class="info-grid" style="${itemsT.html ? "margin-top:12px" : ""}">${loadCells}</div>` : ""),
        itemsT.count ? `${itemsT.count} صنف` : "", "amber")
    : "";

  // إثبات التسليم اتشال — بيانات الطلبية (الأصناف + القطر + النوع + كمية التوريد + الوزن الفعلي) كافية
  const receiptBlock = "";

  const timelineCard = ccHtml("stages", "🚦", "مراحل الشحنة", "اضغط هنا لترى مراحل الشحنة", `<div class="timeline">${timeline || `<div class="empty">لا توجد مراحل</div>`}</div>`, `${doneCount} من ${visIdx.length} مكتملة`, "sky");

  document.getElementById("app").innerHTML = `
    <!-- Hero -->
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-top">
          <div class="hero-main">
            <div class="hero-eyebrow">🚚 متابعة الشحنة</div>
            <h1>${esc(t.customerName || statusText)}</h1>
            ${t.orderNo ? `<div class="hero-sub">أمر بيع رقم <b>#${esc(t.orderNo)}</b></div>` : ""}
            ${eta && !deliveredNow ? `<div class="hero-eta">
              <span class="ic">${eta.late ? "🔴" : "⏰"}</span>
              <div>
                <b>${esc(eta.text)}</b>
                <small>${esc(eta.date)}</small>
              </div>
            </div>` : (deliveredNow && s.deliveredAt ? `<div class="hero-eta">
              <span class="ic">✅</span>
              <div>
                <b>تم التسليم</b>
                <small>${esc(fmt(s.deliveredAt))}</small>
              </div>
            </div>` : "")}
          </div>
          <span class="hero-status ${statusClass}"><span class="hero-dot"></span>${esc(statusText)}</span>
        </div>
        <div class="hero-progress">
          <div class="hp-track"><div class="hp-fill" style="width:${pct}%"></div></div>
          <div class="hp-pct"><b>${pct}%</b> · مرحلة ${doneCount} من ${visIdx.length}</div>
        </div>
      </div>
    </section>

    <div class="grid-main">
      <!-- Main: Timeline -->
      <div>
        ${timelineCard}
        ${orderCard}
        ${receiptBlock}
      </div>

      <!-- Side: Driver + Transport + Docs -->
      <div>
        ${driverCard}
        <div class="card">
          <div class="card-head"><h2>📎 مستندات الشحنة</h2></div>
          <div class="card-body">${renderDocs(t.documents)}</div>
        </div>
      </div>
    </div>

    ${sigBlock ? `<div class="sig-bottom">${sigBlock}</div>` : ""}
  `;

  if (deliveredNow && !alreadySigned) setTimeout(sigInit, 100);
}

load().catch(e => {
  document.getElementById("app").innerHTML = `
    <section class="error-screen">
      <div style="font-size:48px;margin-bottom:10px">🔒</div>
      <h2 style="margin:0 0 10px;color:var(--navy)">تعذر عرض الشحنة</h2>
      <p style="color:var(--muted);margin:0 0 6px">${esc(e.message || "حدث خطأ")}</p>
      <p style="color:var(--muted);margin:0;font-size:12px">تأكد من صحة الرابط أو تواصل مع شركة Iron Gate</p>
    </section>`;
});
</script>
</body>
</html>
